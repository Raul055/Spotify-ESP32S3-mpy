<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi Setup</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #16213e;
    padding: 32px 28px;
    border-radius: 12px;
    width: 260px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h2 {
    margin: 0 0 4px;
    font-size: 20px;
    text-align: center;
  }
  p.subtitle {
    margin: 0 0 20px;
    font-size: 13px;
    color: #8892b0;
    text-align: center;
  }
  label {
    display: block;
    font-size: 12px;
    color: #8892b0;
    margin-bottom: 4px;
    margin-top: 14px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #2a3655;
    background: #0f172a;
    color: #eee;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: #4f7cff;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: #4f7cff;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active {
    background: #3d63d9;
  }
</style>
</head>
<body>
  <div class="card">
    <h2>Device Setup</h2>
    <p class="subtitle">Connect this device to your WiFi</p>
    <form action="/save">
      <label for="ssid">Network Name (SSID)</label>
      <input type="text" id="ssid" name="ssid" required autocomplete="off">

      <label for="pass">Password</label>
      <input type="password" id="pass" name="pass" autocomplete="off">

      <button type="submit">Save & Connect</button>
    </form>
  </div>
</body>
</html>
